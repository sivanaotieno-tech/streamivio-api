services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: streamivio-jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media:ro
    environment:
      - TZ=Africa/Nairobi
    restart: unless-stopped
