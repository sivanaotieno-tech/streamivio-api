name: Streamivio API CI

on:
  push:
    branches: ["main", "feature/standalone-media-engine", "feature/no-key-catalogue-playback"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile API
        run: python -m compileall -q api
      - name: Run API tests
        run: python -m unittest discover -s tests -v
      - name: Validate Hovod Docker Compose configuration
        run: |
          cp media-engine/.env.hovod.example media-engine/.env.hovod
          docker compose -f media-engine/docker-compose.yml config --quiet
